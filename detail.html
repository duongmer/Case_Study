<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chi tiết phòng</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f4f6f9;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
}
</style>
</head>

<body>

<div class="container" id="detail"></div>

<script>
// DATA GIỐNG INDEX
const rooms = [
    {id:1,name:"Phòng đẹp trung tâm",price:1500000,location:"Vinh",desc:"Phòng đầy đủ tiện nghi",img:"https://via.placeholder.com/300"},
    {id:2,name:"Phòng giá rẻ",price:800000,location:"Bến Thủy",desc:"Giá sinh viên",img:"https://via.placeholder.com/300"},
    {id:3,name:"Phòng cao cấp",price:3000000,location:"Vinh",desc:"Full nội thất",img:"https://via.placeholder.com/300"}
];

// LẤY ID
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const room = rooms.find(r => r.id == id);

document.getElementById("detail").innerHTML = `
    <h2>${room.name}</h2>
    <img src="${room.img}">
    <p>📍 ${room.location}</p>
    <p>💰 ${room.price.toLocaleString()} VNĐ</p>
    <p>${room.desc}</p>
`;
</script>

</body>
</html>
