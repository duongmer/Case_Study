<div class="section">
    <h2>📍 Gần ĐH Vinh</h2>
    <div class="grid" id="near"></div>
</div>

<script>
// DATA GIẢ
const rooms = [
    {
        id:1,
        name:"Phòng đẹp trung tâm",
        price:1500000,
        location:"Vinh",
        utility:["wifi"],
        views:100,
        isNew:true,
        nearUni:true,
        img:"https://via.placeholder.com/300"
    },
    {
        id:2,
        name:"Phòng giá rẻ",
        price:800000,
        location:"Bến Thủy",
        utility:["wifi","dieuhoa"],
        views:50,
        isNew:false,
        nearUni:true,
        img:"https://via.placeholder.com/300"
    },
    {
        id:3,
        name:"Phòng cao cấp",
        price:3000000,
        location:"Vinh",
        utility:["dieuhoa"],
        views:200,
        isNew:true,
        nearUni:false,
        img:"https://via.placeholder.com/300"
    }
];

// HIỂN THỊ
function render(list, elementId) {
    let html = "";
    list.forEach(r => {
        html += `
        <div class="card" onclick="goDetail(${r.id})">
            <img src="${r.img}">
            <div class="card-content">
                <h3>${r.name}</h3>
                <p>${r.location}</p>
                <p class="price">${r.price.toLocaleString()} VNĐ</p>
            </div>
        </div>
        `;
    });
    document.getElementById(elementId).innerHTML = html;
}

// LOAD
render(rooms.sort((a,b)=>b.views-a.views).slice(0,3),"popular");
render(rooms.filter(r=>r.isNew),"new");
render(rooms.filter(r=>r.nearUni),"near");

// SEARCH
function search(){
    let min = document.getElementById("minPrice").value;
    let max = document.getElementById("maxPrice").value;
    let location = document.getElementById("location").value;
    let utility = document.getElementById("utility").value;

    let result = rooms.filter(r => {
        return (!min || r.price >= min)
            && (!max || r.price <= max)
            && (!location || r.location == location)
            && (!utility || r.utility.includes(utility));
    });

    render(result,"searchResult");
}

// CHUYỂN TRANG CHI TIẾT
function goDetail(id){
    window.location = "detail.html?id=" + id;
}
</script>
